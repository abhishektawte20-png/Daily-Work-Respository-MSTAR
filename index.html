<title>Leadership Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail of areas, main column with attention strip, filters, one-line-per-document list. Compare mode splits two years side by side. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --fg:#14211f; --muted:#5a6b68; --line:#dbe2e1;
  --accent:#0d6b63; --accent-fg:#ffffff; --accent-soft:#dff0ee;
  --ok:#1d7a46; --ok-soft:#dff3e7; --warn:#9a6200; --warn-soft:#fbefd2; --bad:#b3261e; --bad-soft:#fbe0dd; --idle:#586674; --idle-soft:#e6eaee;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --surface:#172221; --fg:#e6efed; --muted:#93a8a4; --line:#2a3a38;
  --accent:#4fc2b6; --accent-fg:#06201d; --accent-soft:#163a36;
  --ok:#6fd49a; --ok-soft:#173a29; --warn:#e8b64f; --warn-soft:#3b2f12; --bad:#ff8a80; --bad-soft:#42201d; --idle:#a3b1bf; --idle-soft:#26323a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --surface:#172221; --fg:#e6efed; --muted:#93a8a4; --line:#2a3a38;
  --accent:#4fc2b6; --accent-fg:#06201d; --accent-soft:#163a36;
  --ok:#6fd49a; --ok-soft:#173a29; --warn:#e8b64f; --warn-soft:#3b2f12; --bad:#ff8a80; --bad-soft:#42201d; --idle:#a3b1bf; --idle-soft:#26323a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1200px;margin:0 auto;padding-block:20px 48px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px}
@media(max-width:820px){.app{grid-template-columns:1fr}}
/* rail */
.rail{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:16px}
@media(max-width:820px){.rail{position:static}}
.brand{font-weight:600;font-size:18px;letter-spacing:-.01em;margin-bottom:2px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:10px}
@media(max-width:820px){.nav{flex-direction:row;flex-wrap:wrap;gap:6px}}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:none;border-radius:6px;padding:8px 10px;cursor:pointer}
.nav button:hover{background:var(--accent-soft)}
.nav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.nav .n{font-family:var(--mono);font-size:12px;opacity:.8}
.rail .tools{margin-top:14px;display:flex;flex-direction:column;gap:6px}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
.btn.danger{color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.field{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}
/* attention strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(max-width:640px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer}
.stat:hover{border-color:var(--accent)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stat b{display:block;font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters .search{flex:1 1 240px}
.banner{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 150px 110px 150px 96px;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{background:var(--bg);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-block:8px}
.t{min-width:0}
.t strong{font-weight:500;display:block;overflow-wrap:anywhere}
.t small{color:var(--muted);display:block;overflow-wrap:anywhere}
.cat{font-size:12px;color:var(--muted)}
.fy{font-family:var(--mono);font-size:13px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.s-Current,.s-Done{background:var(--ok-soft);color:var(--ok)}
.s-Review,.s-Draft,.s-Open{background:var(--warn-soft);color:var(--warn)}
.s-Archived{background:var(--idle-soft);color:var(--idle)}
.due{font-size:12px;font-family:var(--mono);color:var(--muted);display:block;margin-top:3px}
.due.bad{color:var(--bad);font-weight:500} .due.warn{color:var(--warn);font-weight:500}
.go{text-align:right;display:flex;gap:6px;justify-content:flex-end;align-items:center}
.go a{text-decoration:none;border:1px solid var(--accent);border-radius:6px;padding:5px 10px;font-weight:500;white-space:nowrap}
.go a:hover{background:var(--accent);color:var(--accent-fg)}
.go .ed{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px}
@media(max-width:820px){
  .row{grid-template-columns:1fr auto;grid-template-areas:"t go" "meta meta"}
  .row.head{display:none}
  .row .t{grid-area:t} .row .go{grid-area:go}
  .row .meta{grid-area:meta;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
}
.row .meta{display:contents}
@media(max-width:820px){.row .meta{display:flex}}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
/* compare */
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:820px){.cmp{grid-template-columns:1fr}}
.cmp h3{margin:0 0 8px;font-size:15px;font-weight:600}
.cmp .item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.cmp .item .only{font-size:11px;color:var(--warn);font-family:var(--mono)}
.cmpbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
/* editor */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 16px 20px;overflow:auto;z-index:20}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;max-width:520px;padding:18px;display:grid;gap:12px}
.sheet h2{margin:0;font-size:17px}
.sheet label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.foot{margin-top:18px;color:var(--muted);font-size:12px}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">Leadership Console<small id="whoami">Loading…</small></div>
    <nav class="nav" id="nav" aria-label="Areas"></nav>
    <div class="tools">
      <button class="btn" id="cmpBtn" aria-pressed="false">Compare years</button>
      <button class="btn primary" id="addBtn" hidden>+ Add entry</button>
    </div>
  </aside>
  <main>
    <div id="banner"></div>
    <section class="strip" id="strip" aria-label="Needs attention"></section>
    <div id="view"></div>
    <p class="foot">Files stay in SharePoint. This page keeps the links, owners, dates and status so everything is one click away.</p>
  </main>
</div>
<div id="modal"></div>

<script>
(function(){
"use strict";
var CATS=[["all","Everything"],["Policies & documents","Policies & documents"],["Assessments","Assessments"],["Trackers & reports","Trackers & reports"],["Action items","Action items"]];
var STATUSES=["Current","Review","Draft","Open","Done","Archived"];
var STATUS_LABEL={Review:"In review"};
var TODAY=new Date().toISOString().slice(0,10);
var items=[], db=null, canWrite=false, loaded=false;
var st={cat:"all",fy:"all",status:"all",owner:"all",q:"",attn:"",compare:false,a:"",b:""};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:""}
function lbl(s){return STATUS_LABEL[s]||s}
function closed(i){return i.status==="Done"||i.status==="Archived"}
function attn(i){
  if(closed(i)||!i.due)return "";
  if(i.due<TODAY)return "bad";
  var d=(new Date(i.due)-new Date(TODAY))/864e5;
  return d<=30?"warn":"";
}
function dueText(i){
  if(!i.due)return "";
  var a=attn(i), w=a==="bad"?"Overdue · ":a==="warn"?"Due soon · ":"";
  return '<span class="due '+a+'">'+w+esc(i.due)+'</span>';
}
function fyList(){
  var s={};items.forEach(function(i){if(i.fy)s[i.fy]=1});
  return Object.keys(s).sort().reverse();
}
function ownerList(){
  var s={};items.forEach(function(i){if(i.owner)s[i.owner]=1});
  return Object.keys(s).sort();
}
function scoped(skipAttn){
  var q=st.q.trim().toLowerCase();
  return items.filter(function(i){
    if(st.cat!=="all"&&i.cat!==st.cat)return false;
    if(st.fy!=="all"&&i.fy!==st.fy)return false;
    if(st.status!=="all"&&i.status!==st.status)return false;
    if(st.owner!=="all"&&i.owner!==st.owner)return false;
    if(!skipAttn&&st.attn&&attn(i)!==st.attn)return false;
    if(q&&(i.title+" "+(i.owner||"")+" "+(i.notes||"")+" "+i.cat+" "+i.fy).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){
    var aa=attn(a)==="bad"?0:attn(a)==="warn"?1:2, bb=attn(b)==="bad"?0:attn(b)==="warn"?1:2;
    return aa-bb||(b.fy||"").localeCompare(a.fy||"")||a.title.localeCompare(b.title);
  });
}
function renderNav(){
  $("nav").innerHTML=CATS.map(function(c){
    var n=items.filter(function(i){return c[0]==="all"||i.cat===c[0]}).length;
    return '<button data-cat="'+esc(c[0])+'" aria-pressed="'+(st.cat===c[0])+'">'+esc(c[1])+' <span class="n">'+n+'</span></button>';
  }).join("");
}
function renderStrip(){
  var base=scoped(true), over=0, soon=0, rev=0;
  base.forEach(function(i){var a=attn(i);if(a==="bad")over++;if(a==="warn")soon++;if(i.status==="Review"||i.status==="Draft")rev++});
  function tile(k,n,l,c){return '<button class="stat '+c+'" data-attn="'+k+'" aria-pressed="'+(st.attn===k&&k!=="")+'"><b>'+n+'</b><span>'+l+'</span></button>'}
  $("strip").innerHTML=tile("",base.length,"Entries shown","")+tile("bad",over,"Overdue","bad")+tile("warn",soon,"Due in 30 days","warn")+
    '<div class="stat" style="cursor:default"><b>'+rev+'</b><span>In review or draft</span></div>';
}
function row(i){
  var u=safeUrl(i.link);
  return '<div class="row" data-id="'+esc(i.id)+'">'+
    '<div class="t"><strong>'+esc(i.title)+(i.example?' <span class="pill s-Archived">Sample</span>':'')+'</strong><small>'+esc(i.owner||"No owner")+(i.notes?' · '+esc(i.notes):'')+'</small></div>'+
    '<div class="meta"><div class="c cat">'+esc(i.cat)+'</div><div class="y fy">'+esc(i.fy||"")+'</div>'+
    '<div class="st"><span class="pill s-'+esc(i.status)+'">'+esc(lbl(i.status))+'</span>'+dueText(i)+'</div></div>'+
    '<div class="go">'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Open ↗</a>':'<span class="cat">No link</span>')+
    (canWrite?'<button class="ed" data-edit="'+esc(i.id)+'" aria-label="Edit '+esc(i.title)+'">Edit</button>':'')+'</div></div>';
}
function renderList(){
  var rows=scoped(false);
  var fys=fyList(), owners=ownerList();
  var f='<div class="filters">'+
    '<input class="field search" id="q" type="search" placeholder="Search titles, owners, notes…" value="'+esc(st.q)+'" aria-label="Search">'+
    '<select class="field" id="fFy" aria-label="Year"><option value="all">All years</option>'+fys.map(function(y){return '<option'+(st.fy===y?' selected':'')+'>'+esc(y)+'</option>'}).join("")+'</select>'+
    '<select class="field" id="fSt" aria-label="Status"><option value="all">Any status</option>'+STATUSES.map(function(s){return '<option value="'+s+'"'+(st.status===s?' selected':'')+'>'+esc(lbl(s))+'</option>'}).join("")+'</select>'+
    '<select class="field" id="fOw" aria-label="Owner"><option value="all">Any owner</option>'+owners.map(function(o){return '<option'+(st.owner===o?' selected':'')+'>'+esc(o)+'</option>'}).join("")+'</select>'+
    '<button class="btn" id="reset">Reset</button></div>';
  var body;
  if(!loaded)body='<div class="empty"><b>Loading entries…</b>This takes a moment.</div>';
  else if(!items.length)body='<div class="empty"><b>Nothing here yet</b>'+(canWrite?'Use “Add entry” to add the first policy, assessment or tracker link.':'The owner has not added any entries yet.')+'</div>';
  else if(!rows.length)body='<div class="empty"><b>No entries match</b>Try a different year or clear the filters.</div>';
  else body='<div class="row head"><div>Title</div><div>Area</div><div>Year</div><div>Status</div><div></div></div>'+rows.map(row).join("");
  $("view").innerHTML=f+'<div class="list">'+body+'</div>';
  var q=$("q");
  q.oninput=function(){st.q=q.value;var p=q.selectionStart;renderListOnly();};
  $("fFy").onchange=function(e){st.fy=e.target.value;render()};
  $("fSt").onchange=function(e){st.status=e.target.value;render()};
  $("fOw").onchange=function(e){st.owner=e.target.value;render()};
  $("reset").onclick=function(){st.fy="all";st.status="all";st.owner="all";st.q="";st.attn="";render()};
}
function renderListOnly(){
  var q=$("q").value, pos=$("q").selectionStart;
  render();
  var n=$("q");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}
}
function renderCompare(){
  var fys=fyList();
  if(!st.a)st.a=fys[1]||fys[0]||"";
  if(!st.b)st.b=fys[0]||"";
  function opts(v){return fys.map(function(y){return '<option'+(v===y?' selected':'')+'>'+esc(y)+'</option>'}).join("")}
  var inCat=items.filter(function(i){return st.cat==="all"||i.cat===st.cat});
  var A=inCat.filter(function(i){return i.fy===st.a}), B=inCat.filter(function(i){return i.fy===st.b});
  var key=function(i){return i.cat+"|"+i.title.toLowerCase().replace(/\b(fy)?\s?20\d\d\b/g,"").replace(/\s+/g," ").trim()};
  var ka={},kb={};A.forEach(function(i){ka[key(i)]=1});B.forEach(function(i){kb[key(i)]=1});
  function col(list,other,label){
    return '<div><h3>'+esc(label)+' <span class="cat">('+list.length+')</span></h3>'+(list.length?list.map(function(i){
      var u=safeUrl(i.link);
      return '<div class="item"><div class="t"><strong>'+esc(i.title)+'</strong><small>'+esc(i.cat)+' · '+esc(i.owner||"No owner")+'</small>'+(other[key(i)]?'':'<span class="only">Only in '+esc(label)+'</span>')+'</div>'+
        '<div class="go"><span class="pill s-'+esc(i.status)+'">'+esc(lbl(i.status))+'</span>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Open ↗</a>':'')+'</div></div>';
    }).join(""):'<div class="empty">No entries for this year.</div>')+'</div>';
  }
  $("view").innerHTML=fys.length<1?'<div class="empty"><b>No years to compare yet</b>Add entries with a year first.</div>':
   '<div class="cmpbar"><label>Compare <select class="field" id="cA">'+opts(st.a)+'</select></label><label>with <select class="field" id="cB">'+opts(st.b)+'</select></label>'+
   '<span class="cat">Area: '+esc(st.cat==="all"?"Everything":st.cat)+' (change it in the left menu)</span></div>'+
   '<div class="cmp">'+col(A,kb,st.a)+col(B,ka,st.b)+'</div>';
  if(fys.length){$("cA").onchange=function(e){st.a=e.target.value;render()};$("cB").onchange=function(e){st.b=e.target.value;render()};}
}
function renderBanner(){
  var ex=items.filter(function(i){return i.example}).length;
  $("banner").innerHTML=ex&&canWrite?'<div class="banner"><span><b>'+ex+' sample entries</b> are showing so you can see how it works. Replace them with your real SharePoint links.</span><button class="btn danger" id="clearEx">Remove samples</button></div>':"";
  var b=$("clearEx");
  if(b)b.onclick=function(){
    b.disabled=true;
    Promise.all(items.filter(function(i){return i.example}).map(function(i){return db.doc("items/"+i.id).delete()})).catch(function(){});
  };
}
function render(){
  renderNav();renderBanner();
  $("strip").hidden=st.compare;
  $("cmpBtn").setAttribute("aria-pressed",st.compare);
  $("cmpBtn").textContent=st.compare?"Back to list":"Compare years";
  $("addBtn").hidden=!canWrite;
  if(st.compare)renderCompare();else{renderStrip();renderList();}
}
/* editor */
function openEditor(id){
  var it=id?items.filter(function(x){return x.id===id})[0]:null;
  var d=it||{title:"",cat:st.cat==="all"?CATS[1][0]:st.cat,fy:"FY"+(new Date().getFullYear()),owner:"",status:"Current",due:"",link:"",notes:""};
  function opt(list,v,l){return list.map(function(x){var val=Array.isArray(x)?x[0]:x;return '<option value="'+esc(val)+'"'+(v===val?' selected':'')+'>'+esc(l?l(x):val)+'</option>'}).join("")}
  $("modal").innerHTML='<div class="scrim"><form class="sheet" id="f"><h2>'+(it?'Edit entry':'Add entry')+'</h2>'+
   '<label>Title<input class="field" id="eT" required value="'+esc(d.title)+'" placeholder="e.g. Code of Conduct Policy"></label>'+
   '<div class="two"><label>Area<select class="field" id="eC">'+opt(CATS.slice(1),d.cat,function(x){return x[1]})+'</select></label>'+
   '<label>Year<input class="field" id="eY" value="'+esc(d.fy)+'" placeholder="FY2026"></label></div>'+
   '<div class="two"><label>Owner<input class="field" id="eO" value="'+esc(d.owner)+'" placeholder="Name or team"></label>'+
   '<label>Status<select class="field" id="eS">'+opt(STATUSES,d.status,lbl)+'</select></label></div>'+
   '<label>SharePoint link<input class="field" id="eL" type="url" value="'+esc(d.link)+'" placeholder="https://…sharepoint.com/…"></label>'+
   '<label>Next review or due date<input class="field" id="eD" type="date" value="'+esc(d.due)+'"></label>'+
   '<label>Notes<input class="field" id="eN" value="'+esc(d.notes)+'" placeholder="Optional"></label>'+
   '<div class="acts">'+(it?'<button type="button" class="btn danger" id="eDel">Delete</button>':'')+'<button type="button" class="btn" id="eX">Cancel</button><button class="btn primary" id="eSave">Save</button></div></form></div>';
  $("eX").onclick=function(){$("modal").innerHTML=""};
  if(it)$("eDel").onclick=function(){db.doc("items/"+it.id).delete().then(function(){$("modal").innerHTML=""}).catch(function(){})};
  $("f").onsubmit=function(e){
    e.preventDefault();
    var body={title:$("eT").value.trim(),cat:$("eC").value,fy:$("eY").value.trim(),owner:$("eO").value.trim(),status:$("eS").value,
      link:$("eL").value.trim(),due:$("eD").value,notes:$("eN").value.trim(),example:false};
    if(!body.title)return;
    $("eSave").disabled=true;
    var ref=it?db.doc("items/"+it.id):db.collection("items").doc();
    ref.set(body).then(function(){$("modal").innerHTML=""}).catch(function(){$("eSave").disabled=false;$("eSave").textContent="Could not save, retry"});
  };
  $("eT").focus();
}
/* events */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-cat],[data-attn],[data-edit]");
  if(!t)return;
  if(t.hasAttribute("data-cat")){st.cat=t.getAttribute("data-cat");render()}
  else if(t.hasAttribute("data-attn")){var k=t.getAttribute("data-attn");st.attn=(st.attn===k)?"":k;render()}
  else if(t.hasAttribute("data-edit"))openEditor(t.getAttribute("data-edit"));
});
$("cmpBtn").onclick=function(){st.compare=!st.compare;render()};
$("addBtn").onclick=function(){openEditor(null)};
/* data */
render();
var timer=setTimeout(function(){if(!loaded){$("whoami").textContent="Can't reach saved entries yet"}},10000);
(async function(){
  var user=null;
  try{user=await claude.use("user")}catch(e){}
  canWrite=!!(user&&user.canEdit&&user.canEdit());
  $("whoami").textContent=canWrite?"Editor view":"View only";
  try{db=await claude.use("db")}catch(e){}
  if(!db){loaded=true;clearTimeout(timer);$("whoami").textContent="Sign in to see entries";render();return}
  db.collection("items").onSnapshot(function(snap){
    items=snap.docs.map(function(d){var x=d.data();x.id=d.id;return x});
    loaded=true;clearTimeout(timer);render();
  },function(){loaded=true;clearTimeout(timer);$("whoami").textContent="Entries unavailable";render()});
})();
})();
</script>
